<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Look up current weather and hourly outlook by location using Visual Crossing.">
  <title>SkyScope — Weather Outlook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/axios@1.6.8/dist/axios.min.js" defer></script>
  <script src="config.js" defer></script>
  <script src="script.js" defer></script>
</head>

<body>
  <div class="sky-backdrop" aria-hidden="true">
    <div class="sky-glow sky-glow--1"></div>
    <div class="sky-glow sky-glow--2"></div>
  </div>

  <main class="app">
    <header class="app-header">
      <h1 class="app-title">SkyScope</h1>
      <p class="app-subtitle">Current conditions and a 24-hour outlook for any city</p>
    </header>

    <section class="card search-card" aria-labelledby="search-heading">
      <h2 id="search-heading" class="visually-hidden">Search location</h2>
      <form id="location-form" class="location-form" novalidate>
        <label class="field-label" for="location-input">Location</label>
        <div class="form-row">
          <input
            type="text"
            id="location-input"
            name="location"
            class="location-input"
            placeholder="e.g. London or San Francisco, CA"
            autocomplete="off"
            required
            maxlength="80"
            inputmode="text"
          >
          <button type="submit" class="btn btn-primary" id="submit-button">Get weather</button>
        </div>
        <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section id="weather-content" class="weather-panel" hidden aria-busy="false" aria-labelledby="weather-heading">
      <h2 id="weather-heading" class="visually-hidden">Weather details</h2>

      <article class="card current-card">
        <div class="current-main">
          <div class="current-icon-wrap">
            <span id="condition-icon" class="condition-icon" aria-hidden="true">☁</span>
          </div>
          <div class="current-details">
            <p id="place-name" class="place-name">—</p>
            <p id="current-date" class="current-date">—</p>
            <p id="condition-label" class="condition-label">—</p>
            <p id="temperature" class="temperature" aria-label="Current temperature">—</p>
            <p id="feels-like" class="local-time">—</p>
          </div>
        </div>

        <dl class="stats-grid">
          <div class="stat">
            <dt>Wind speed</dt>
            <dd id="wind-speed">—</dd>
          </div>
          <div class="stat">
            <dt>Rain likelihood</dt>
            <dd id="rain-chance">—</dd>
          </div>
          <div class="stat">
            <dt>Today&apos;s range</dt>
            <dd id="day-range">—</dd>
          </div>
        </dl>
      </article>

      <section class="hourly-section card" aria-labelledby="hourly-heading">
        <div class="hourly-toolbar">
          <h3 id="hourly-heading" class="hourly-title">Hourly outlook</h3>
          <div class="toolbar-actions">
            <div class="range-toggle" role="group" aria-label="Hourly time range">
              <button type="button" class="range-button active" data-range="previous">Previous 24h</button>
              <button type="button" class="range-button" data-range="next">Next 24h</button>
            </div>
            <button type="button" class="btn btn-secondary" id="refresh-button">Refresh</button>
          </div>
        </div>
        <div id="hourly-list" class="hourly-list" role="list"></div>
      </section>
    </section>
  </main>
</body>

</html>
