<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temperature Converter</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>

  <main class="container">
    <h1 class="heading">Temperature Converter</h1>

    <form id="converter-form" class="converter-form" novalidate>
      <div class="field">
        <label class="field__label" for="temperature-input">Temperature</label>
        <input type="number" id="temperature-input" class="field__input" placeholder="Enter a value" step="any"
          inputmode="decimal">
      </div>

      <div class="field">
        <label class="field__label" for="from-unit">Convert from</label>
        <select id="from-unit" class="field__select" aria-label="Unit to convert from"></select>
      </div>

      <div class="field">
        <label class="field__label" for="to-unit">Convert to</label>
        <select id="to-unit" class="field__select" aria-label="Unit to convert to"></select>
      </div>

      <button type="button" id="convert-btn" class="convert-btn" disabled>Convert</button>
    </form>

    <p id="result-output" class="result-output" aria-live="polite" hidden></p>
  </main>

</body>

</html>
